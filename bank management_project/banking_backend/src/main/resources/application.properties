spring.datasource.url=jdbc:mysql://localhost:3306/banking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.datasource.initialization-mode=always
spring.sql.init.mode=always
spring.sql.init.platform=mysql

server.port=8080

# Always serialize dates as ISO-8601 strings (never as numeric arrays),
# so the desktop client can parse transaction timestamps reliably.
spring.jackson.serialization.write-dates-as-timestamps=false
